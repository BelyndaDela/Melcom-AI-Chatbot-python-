<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melcom AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .chat-container { width: 430px; max-width: 100%; height: 650px; background: white; border-radius: 16px; box-shadow: 0 5px 25px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #006b3c; color: white; padding: 20px; text-align: center; }
        .chat-header h2 { margin-bottom: 6px; }
        .chat-header p { font-size: 13px; opacity: .9; }
        .chat-box { flex: 1; padding: 18px; overflow-y: auto; background: #f8f9fa; }
        .message { margin-bottom: 14px; padding: 11px 14px; border-radius: 12px; max-width: 82%; line-height: 1.5; white-space: pre-line; }
        .bot { background: #e9ecef; color: #222; }
        .user { background: #006b3c; color: white; margin-left: auto; }
        .input-area { display: flex; padding: 14px; border-top: 1px solid #ddd; background: white; }
        #message-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        #send-button { margin-left: 10px; padding: 12px 18px; border: 0; border-radius: 8px; background: #006b3c; color: white; cursor: pointer; }
        #send-button:hover { background: #004d2c; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>🤖 Melcom AI Assistant</h2>
        <p>Your virtual shopping assistant</p>
    </div>
    <div id="chat-box" class="chat-box">
        <div class="message bot">Hello! 👋 Welcome to Melcom Ghana. How can I assist you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
        <button id="send-button">Send</button>
    </div>
</div>
<script>
const input = document.getElementById("message-input");
const button = document.getElementById("send-button");
const chatBox = document.getElementById("chat-box");

function addMessage(message, sender) {
    const element = document.createElement("div");
    element.classList.add("message", sender);
    element.textContent = message;
    chatBox.appendChild(element);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    button.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message})
        });

        const data = await response.json();
        addMessage(data.reply || "Sorry, I could not generate a response.", "bot");
    } catch (error) {
        addMessage("Sorry, I couldn't connect to the chatbot server.", "bot");
        console.error(error);
    } finally {
        button.disabled = false;
        input.focus();
    }
}

button.addEventListener("click", sendMessage);
input.addEventListener("keypress", (event) => {
    if (event.key === "Enter") sendMessage();
});
</script>
</body>
</html>
